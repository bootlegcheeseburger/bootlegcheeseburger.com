# Shop conventions for this repo. Checked by `just -f ~/Code/blc/justfile deps-check`
# (and doctor). Tiers: shipped | tool | sandbox (see ~/Code/blc/README.md).

[deps]
tier = "sandbox"

[board]          # epiq; LOCAL ONLY: origin is public, so the state worktree has a dead pushurl
in_progress = "01M5FRJWPRYJJ1532WQ402REG4"   # turns the shared board hooks on
testdrive = ".local-dev/testdrive.md"        # hand-test lines, gitignored
hub = ".claude/HUB.md"
tags = { area = ["store", "legal", "site", "showcase", "hosting"] }   # store: Paddle checkout + serial worker; site: layout, style, about; showcase: product cards; hosting: DNS, deploy
